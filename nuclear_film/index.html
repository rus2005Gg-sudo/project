    <script>
      const C = window.CUE, E = C.e;
      const tl = gsap.timeline({ paused: true });
      const cap = document.getElementById("cap");
      const add = (arr, cls) => arr.forEach((c) => {
        const el = document.createElement("div"); el.className = "chunk " + cls;
        const s = document.createElement("span"); s.className = "t"; s.textContent = c.t;
        el.appendChild(s); cap.appendChild(el);
        tl.set(el, { opacity: 1 }, c.s); tl.fromTo(s, { y: 10, opacity: 0.2 }, { y: 0, opacity: 1, duration: 0.25, ease: "power2.out" }, c.s); tl.set(el, { opacity: 0 }, c.e);
      });
      add(window.CAPS, "narr"); add(window.RCAPS, "radio");
      const plate = (id, a, b) => { tl.set(id, { opacity: 0 }, 0); tl.fromTo(id, { opacity: 0, y: -14 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, a); tl.to(id, { opacity: 0, duration: 0.5 }, b - 0.5); };
      plate("#plate-r1", E.rule1, E.rule2 - 0.1); plate("#plate-r2", E.rule2, E.rule3 - 0.1); plate("#plate-r3", E.rule3, E.rule4 - 0.1); plate("#plate-r4", E.rule4, E.rule5 - 0.1); plate("#plate-r5", E.rule5, E.fin);
      tl.fromTo("#titleA", { opacity: 0 }, { opacity: 1, duration: 0.8 }, 1.2); tl.to("#titleA", { opacity: 0, duration: 0.8 }, 3.6);
      tl.fromTo("#titleEnd", { opacity: 0 }, { opacity: 1, duration: 0.9 }, C.endBlack + 0.2);
      window.__timelines["main"] = tl;
      const tm = document.getElementById("tm"), timer = document.getElementById("timer"), hudt = document.getElementById("hudt");
      const T0 = 15.0;
      window.__ui = (t) => {
        const show = t >= T0 && t < E.flash + 0.2;
        timer.style.opacity = show ? 1 : 0;
        const left = Math.max(0, 180 * (1 - (t - T0) / (E.flash - T0)));
        tm.textContent = String(Math.floor(left / 60)).padStart(2, "0") + ":" + String(Math.floor(left % 60)).padStart(2, "0");
        const mins = 47 + Math.floor(t / 60); hudt.textContent = t < E.flash ? "21:" + String(mins).padStart(2, "0") : "21:48 · ВСПЫШКА";
        if (t >= E.flash) hudt.textContent = "21:48 · СИГНАЛ ПОТЕРЯН";
      };
