    <div id="root" data-composition-id="main" data-start="0" data-width="1080" data-height="1920" data-duration="104">

      <div id="vignette" class="layer"></div>

      <div id="grain" class="layer"></div>

      <div id="plate-hook" class="plate"><div class="big sm">ЕСЛИ ЛИФТ ОТКРЫЛСЯ В 03:17 — <span class="y">НЕ ЗАХОДИ</span></div></div>
      <div id="plate-r1" class="plate"><div class="tag">ПРАВИЛО №1</div><div class="big"><span class="r">НЕ СМОТРИ</span> В ЗЕРКАЛО</div></div>
      <div id="plate-r2" class="plate"><div class="tag">ПРАВИЛО №2</div><div class="big"><span class="y">НЕ ОТВЕЧАЙ</span> НА ЗВОНОК</div></div>
      <div id="plate-r3" class="plate"><div class="tag">ПРАВИЛО №3</div><div class="big">ЕСЛИ УВИДИШЬ СЕБЯ — <span class="r">НЕ ВЫХОДИ</span></div></div>
      <div id="plate-end" class="plate"><div class="big sm">ЕСЛИ УВИДИШЬ ЭТОТ ЛИФТ<br><span class="y">— НЕ ЗАХОДИ</span></div></div>

      <div id="cap"></div>
      <div id="flash" class="layer"></div>
      <div id="dip" class="layer"></div>
      <div id="part2">ЧАСТЬ 2</div>

      <audio id="vo" src="assets/vo_master.wav" data-start="0" data-duration="101.56" data-track-index="2" data-volume="1"></audio>
      <audio id="bed" src="assets/bed.wav" data-start="0" data-duration="103" data-track-index="3" data-volume="0.4"></audio>
    </div>

    <script>
      // captions + plates: one seekable GSAP timeline
      const tl = gsap.timeline({ paused: true });
      const cap = document.getElementById("cap");
      const RED = /(НЕ СМОТРИ|НЕ ВЫХОДИ|ВЫШЕЛ)/g, YEL = /(НЕ ЗАХОДИ|НЕ ОТВЕЧАЙ)/g;
      window.CAPS.forEach((c, i) => {
        if (c.e < 3.9) return; // hook plate already carries these words
        const el = document.createElement("div");
        el.className = "chunk" + (/ЗЕРКАЛО|ЗВОНОК|НЕ ВЫХОДИ|НЕ ЗАХОДИ/.test(c.t) && /НЕ /.test(c.t) ? " big" : "");
        el.id = "c" + i;
        const s = document.createElement("span");
        s.className = "t";
        s.innerHTML = c.t.replace(RED, '<span class="r">$1</span>').replace(YEL, '<span class="y">$1</span>');
        el.appendChild(s);
        cap.appendChild(el);
        tl.set(el, { opacity: 1 }, c.s);
        tl.fromTo(s, { scale: 0.86 }, { scale: 1, duration: 0.14, ease: "back.out(2.4)" }, c.s);
        tl.set(el, { opacity: 0 }, c.e);
      });
      const plate = (id, a, b) => {
        tl.set(id, { opacity: 1 }, a);
        tl.fromTo(id, { scale: 1.25 }, { scale: 1, duration: 0.18, ease: "power4.out" }, a);
        tl.to(id, { x: 6, duration: 0.05, yoyo: true, repeat: 3, ease: "none" }, a + 0.2);
        tl.set(id, { opacity: 0 }, b);
      };
      plate("#plate-hook", 0.0, 5.0);
      plate("#plate-r1", 23.84, 31.0);
      plate("#plate-r2", 39.86, 46.4);
      plate("#plate-r3", 58.82, 66.0);
      plate("#plate-end", 93.45, 101.5);
      tl.set("#part2", { opacity: 1 }, 101.7);
      window.__timelines["main"] = tl;
    </script>
