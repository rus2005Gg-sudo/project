<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#222}</style>
<script type="importmap">{"imports":{"three":"../assets/vendor/three.module.js"}}</script></head><body>
<canvas id="gl" width="900" height="1200"></canvas>
<script type="module">
import * as THREE from "three";
import { buildTextures } from "../js/tex.js";
import { makeHuman } from "../js/human.js";
const T = buildTextures(); const H = makeHuman(T);
const r = new THREE.WebGLRenderer({canvas:document.getElementById("gl"),antialias:true,preserveDrawingBuffer:true}); r.setSize(900,1200,false);
r.toneMapping=THREE.ACESFilmicToneMapping; r.shadowMap.enabled=true;
const s = new THREE.Scene(); s.background=new THREE.Color(0x3a4150); s.add(H.root);
s.add(new THREE.HemisphereLight(0xbfd4ff,0x403020,1.1)); const d=new THREE.DirectionalLight(0xffffff,2.4); d.position.set(2,3,3); d.castShadow=true; s.add(d);
const fl=new THREE.Mesh(new THREE.PlaneGeometry(10,10),new THREE.MeshStandardMaterial({color:0x777777})); fl.rotation.x=-Math.PI/2; fl.receiveShadow=true; s.add(fl);
const cam=new THREE.PerspectiveCamera(30,900/1200,0.1,50); s.add(cam);
const q=new URLSearchParams(location.search); const mode=q.get("m")||"front";
const side=(a,b)=>({sL:a,sR:[a[0],-a[1],-a[2]]});
H.apply({sL:[0.05,0,0.12],sR:[0.05,0,-0.12],eL:[-0.2,0,0],eR:[-0.2,0,0],hL:[0,0,0.03],hR:[0,0,-0.03]});
H.setFingers("L",{all:0.25}); H.setFingers("R",{all:0.25}); H.face({});
if(mode==="front"){cam.position.set(0,1.1,5.2);cam.lookAt(0,0.95,0);}
if(mode==="side"){cam.position.set(5.2,1.1,0);cam.lookAt(0,0.95,0);}
if(mode==="head"){cam.fov=12;cam.updateProjectionMatrix();cam.position.set(0.5,1.75,4.5);cam.lookAt(0,1.72,0);}
if(mode==="hand"){H.apply({sR:[-1.4,0,-0.3],eR:[-1.2,0,0],sL:[0.05,0,0.12],eL:[-0.2,0,0]});H.setFingers("R",{all:0});cam.fov=12;cam.updateProjectionMatrix();cam.position.set(-3.5,1.6,3.2);cam.lookAt(-0.35,1.35,0.45);}
r.render(s,cam); window.done=true;
</script></body></html>
