<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1696, height=672" />
    <title>Horz — на своей волне</title>
    <script src="assets/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Montserrat"; font-weight: 600; src: url("assets/fonts/montserrat-latin-600-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2212, U+FEFF, U+FFFD; }
      @font-face { font-family: "Montserrat"; font-weight: 600; src: url("assets/fonts/montserrat-cyrillic-600-normal.woff2") format("woff2"); unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
      @font-face { font-family: "Montserrat"; font-weight: 800; src: url("assets/fonts/montserrat-latin-800-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2212, U+FEFF, U+FFFD; }
      @font-face { font-family: "Montserrat"; font-weight: 800; src: url("assets/fonts/montserrat-cyrillic-800-normal.woff2") format("woff2"); unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
      @font-face { font-family: "Montserrat"; font-weight: 900; src: url("assets/fonts/montserrat-latin-900-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2212, U+FEFF, U+FFFD; }
      @font-face { font-family: "Montserrat"; font-weight: 900; src: url("assets/fonts/montserrat-cyrillic-900-normal.woff2") format("woff2"); unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }

      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1696px; height: 672px; overflow: hidden; background: #00ff00; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "Montserrat", sans-serif; }

      /* chroma-key surround is green: the brand blue must survive keying */
      #card {
        position: absolute; inset: 0; border-radius: 80px; overflow: hidden;
        background: linear-gradient(180deg, #fbfcfe 0%, #eceff5 100%);
      }
      #glow {
        position: absolute; inset: 0;
        background: radial-gradient(ellipse 60% 70% at 50% 100%, rgba(10, 77, 255, 0.16), rgba(10, 77, 255, 0) 70%);
      }
      #waves { position: absolute; left: 0; top: 0; width: 1696px; height: 672px; }

      .layer { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding-bottom: 90px; }

      #stack { position: relative; width: 220px; height: 220px; }
      .ring { position: absolute; inset: 0; border-radius: 50%; border: 6px solid #0a4dff; opacity: 0; }
      #btn {
        position: absolute; inset: 0; border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, #4f86ff, #0a4dff 60%, #0036c9);
        box-shadow: 0 24px 60px rgba(10, 77, 255, 0.45), 0 0 0 10px rgba(10, 77, 255, 0.10);
        display: flex; align-items: center; justify-content: center;
      }

      #word { display: flex; align-items: flex-end; font-weight: 900; font-size: 230px; line-height: 0.9; letter-spacing: -9px; color: #0a0a0c; }
      .ch { display: inline-block; }
      #dot { display: block; width: 44px; height: 44px; border-radius: 50%; background: #0a4dff; margin: 0 0 18px 12px; }
      #tag { margin-top: 26px; font-weight: 800; font-size: 62px; letter-spacing: -2px; color: #0a0a0c; white-space: nowrap; }
      #tag span { color: #0a4dff; }

      #cta { padding-top: 130px; padding-bottom: 0; }
      #pillwrap { position: relative; }
      #pillglow { position: absolute; inset: -14px; border-radius: 999px; box-shadow: 0 0 0 14px rgba(10, 77, 255, 0.18), 0 0 60px rgba(10, 77, 255, 0.45); opacity: 0; }
      #pill {
        position: relative; display: flex; align-items: center; gap: 24px;
        background: #0a0a0c; border-radius: 999px; padding: 20px 64px 20px 22px;
        box-shadow: 0 24px 50px rgba(10, 10, 12, 0.25);
      }
      #tg { width: 92px; height: 92px; border-radius: 50%; background: linear-gradient(180deg, #2aabee, #229ed9); display: flex; align-items: center; justify-content: center; }
      #handle { font-weight: 800; font-size: 84px; letter-spacing: -2px; color: #ffffff; white-space: nowrap; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1696" data-height="672">
      <div id="card">
        <div id="glow"></div>

        <svg id="waves" viewBox="0 0 1696 672">
          <defs>
            <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0" stop-color="#fff" stop-opacity="0" />
              <stop offset="0.12" stop-color="#fff" stop-opacity="1" />
              <stop offset="0.88" stop-color="#fff" stop-opacity="1" />
              <stop offset="1" stop-color="#fff" stop-opacity="0" />
            </linearGradient>
            <mask id="edge" maskUnits="userSpaceOnUse" x="0" y="0" width="1696" height="672">
              <rect x="0" y="0" width="1696" height="672" fill="url(#fade)" />
            </mask>
          </defs>
          <g mask="url(#edge)" data-layout-allow-overflow>
            <line id="flat" x1="0" y1="566" x2="1696" y2="566" stroke="#c7cbd4" stroke-width="6" stroke-linecap="round" stroke-dasharray="1696" stroke-dashoffset="1696" />
            <g transform="translate(0 566)"><g id="ampB"><g id="travelB"><path id="pathB" fill="none" stroke="#0a4dff" stroke-opacity="0.25" stroke-width="6" stroke-linecap="round" /></g></g></g>
            <g transform="translate(0 566)"><g id="ampA"><g id="travelA"><path id="pathA" fill="none" stroke="#0a4dff" stroke-width="10" stroke-linecap="round" /></g></g></g>
          </g>
        </svg>

        <div class="layer" id="power">
          <div id="stack">
            <div class="ring" id="ring1"></div>
            <div class="ring" id="ring2"></div>
            <div id="btn">
              <svg viewBox="0 0 24 24" width="100" height="100" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round">
                <path d="M12 3v8" />
                <path d="M6.3 6.8a8 8 0 1 0 11.4 0" />
              </svg>
            </div>
          </div>
        </div>

        <div class="layer" id="brand" data-layout-allow-overflow>
          <div id="word">
            <span class="ch">H</span><span class="ch">O</span><span class="ch">R</span><span class="ch">Z</span><span id="dot"></span>
          </div>
          <div id="tag">На своей волне<span>.</span></div>
        </div>

        <div class="layer" id="cta">
          <div id="pillwrap">
            <div id="pillglow"></div>
            <div id="pill">
              <div id="tg">
                <svg viewBox="0 0 24 24" width="54" height="54">
                  <path d="M3 11.5l16.5-6.5c.8-.3 1.5.2 1.2 1.4l-2.8 13.2c-.2 1-.8 1.2-1.6.7l-4.4-3.3-2.1 2c-.2.2-.4.4-.9.4l.3-4.5 8.2-7.4c.4-.3-.1-.5-.5-.2L6.8 13.6 2.5 12.3c-.9-.3-.9-.9.5-.8z" fill="#ffffff" />
                </svg>
              </div>
              <div id="handle">@horzvpnbot</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      // deterministic sine paths; travel by whole periods so the loop is seamless
      function sine(width, period, amp, y, phase) {
        let d = "";
        for (let x = 0; x <= width; x += 8) {
          const v = y + Math.sin((x / period) * Math.PI * 2 + phase) * amp;
          d += (x === 0 ? "M" : "L") + x + " " + v.toFixed(2);
        }
        return d;
      }
      document.getElementById("pathA").setAttribute("d", sine(3392, 424, 42, 0, 0));
      document.getElementById("pathB").setAttribute("d", sine(3392, 565.333, 30, 0, 1.4));

      const tl = gsap.timeline({ paused: true });

      // card + "no signal" flat line
      tl.fromTo("#card", { opacity: 0, scale: 0.94 }, { opacity: 1, scale: 1, duration: 0.4, ease: "power3.out" }, 0);
      tl.fromTo("#flat", { strokeDashoffset: 1696 }, { strokeDashoffset: 0, duration: 0.6, ease: "power2.out" }, 0.15);

      // power button: appear, press, shockwave
      tl.fromTo("#btn", { scale: 0 }, { scale: 1, duration: 0.5, ease: "back.out(1.8)" }, 0.3);
      tl.to("#btn", { scale: 0.86, duration: 0.1, ease: "power2.in" }, 0.95);
      tl.to("#btn", { scale: 1, duration: 0.15, ease: "back.out(3)" }, 1.05);
      tl.fromTo("#ring1", { scale: 0.8, opacity: 0.7 }, { scale: 2.6, opacity: 0, duration: 0.55, ease: "power2.out" }, 1.0);
      tl.fromTo("#ring2", { scale: 0.8, opacity: 0.5 }, { scale: 3.2, opacity: 0, duration: 0.6, ease: "power2.out" }, 1.1);
      tl.to("#btn", { scale: 0.3, opacity: 0, duration: 0.25, ease: "power2.in" }, 1.22);

      // flat line becomes a living wave
      tl.to("#flat", { opacity: 0, duration: 0.3 }, 1.05);
      tl.fromTo("#ampA", { scaleY: 0.02, transformOrigin: "50% 50%" }, { scaleY: 1, transformOrigin: "50% 50%", duration: 0.7, ease: "power3.out" }, 1.05);
      tl.fromTo("#ampB", { scaleY: 0.02, opacity: 0, transformOrigin: "50% 50%" }, { scaleY: 1, opacity: 1, transformOrigin: "50% 50%", duration: 0.8, ease: "power3.out" }, 1.15);
      tl.fromTo("#travelA", { x: 0 }, { x: -1696, duration: 5, ease: "none" }, 0);
      tl.fromTo("#travelB", { x: -1696 }, { x: 0, duration: 5, ease: "none" }, 0);
      tl.fromTo("#glow", { opacity: 0 }, { opacity: 1, duration: 0.8 }, 1.05);

      // HORZ + the dot lands
      tl.fromTo(".ch", { y: 90, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power4.out", stagger: 0.06 }, 1.5);
      tl.fromTo("#dot", { y: -420, scale: 0.6 }, { y: 0, scale: 1, duration: 0.7, ease: "bounce.out" }, 1.9);
      tl.fromTo("#tag", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 2.45);

      // hand-off to the bot handle
      tl.to("#tag", { opacity: 0, y: -10, duration: 0.3 }, 3.45);
      tl.to("#brand", { y: -150, scale: 0.6, duration: 0.6, ease: "power3.inOut" }, 3.5);
      tl.to("#ampA", { scaleY: 0.5, transformOrigin: "50% 50%", duration: 0.6, ease: "power2.inOut" }, 3.5);
      tl.to("#ampB", { scaleY: 0.5, transformOrigin: "50% 50%", duration: 0.6, ease: "power2.inOut" }, 3.5);
      tl.fromTo("#pill", { y: 50, scale: 0.9, opacity: 0 }, { y: 0, scale: 1, opacity: 1, duration: 0.55, ease: "back.out(1.6)" }, 3.75);
      tl.fromTo("#pillglow", { opacity: 0 }, { opacity: 1, duration: 0.35, yoyo: true, repeat: 1 }, 4.15);
      tl.to("#pill", { scale: 0.95, duration: 0.08, ease: "power2.in" }, 4.45);
      tl.to("#pill", { scale: 1, duration: 0.25, ease: "back.out(3)" }, 4.53);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
