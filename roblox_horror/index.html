<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Nobody Else Is In This Server</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <script src="assets/captions.js"></script>
    <script src="assets/cues.js"></script>
    <script src="shots.js"></script>
    <script type="importmap">
      { "imports": { "three": "./assets/vendor/three.module.js" } }
    </script>
    <style>
      @font-face { font-family: "Mont"; font-weight: 800; src: url("assets/fonts/montserrat-latin-800-normal.woff2") format("woff2"); }
      @font-face { font-family: "Mont"; font-weight: 900; src: url("assets/fonts/montserrat-latin-900-normal.woff2") format("woff2"); }
      html, body { margin: 0; background: #000; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: "Mont", sans-serif; }
      #gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      .layer { position: absolute; inset: 0; pointer-events: none; }
      #vignette { background: radial-gradient(ellipse at 50% 46%, rgba(0,0,0,0) 45%, rgba(0,0,0,.5) 100%); }
      #grain { opacity: .08; mix-blend-mode: overlay; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='300' height='300' filter='url(%23n)'/></svg>"); background-size: 300px 300px; }
      #flash { background: #fff; opacity: 0; }
      #redtint { background: #b00014; opacity: 0; mix-blend-mode: multiply; }
      #glitch { background: linear-gradient(90deg, rgba(255,0,60,.25), rgba(0,255,255,.25)); opacity: 0; mix-blend-mode: screen; }
      #dip { background: #000; opacity: 1; }

      /* ---------- Roblox-style HUD ---------- */
      .hud-btn { position: absolute; top: 46px; width: 76px; height: 76px; border-radius: 14px; background: rgba(20,22,28,.62); border: 3px solid rgba(255,255,255,.22); }
      #hud-menu { left: 36px; } #hud-chat { left: 128px; }
      .hud-btn i { position: absolute; left: 18px; right: 18px; height: 6px; background: #fff; border-radius: 3px; }
      #hud-menu i:nth-child(1) { top: 24px; } #hud-menu i:nth-child(2) { top: 35px; } #hud-menu i:nth-child(3) { top: 46px; }
      #hud-chat b { position: absolute; left: 16px; top: 18px; width: 44px; height: 32px; border-radius: 8px; background: #fff; }
      #hud-chat b:after { content: ""; position: absolute; left: 8px; bottom: -10px; border: 8px solid transparent; border-top-color: #fff; border-bottom: 0; }
      #chat { position: absolute; left: 36px; top: 140px; width: 600px; min-height: 40px; padding: 14px 18px; background: rgba(15,17,22,.55); border-radius: 12px; color: #fff; font-weight: 800; font-size: 31px; line-height: 1.32; text-shadow: 0 2px 4px rgba(0,0,0,.9); }
      #chat .ln { opacity: 0; max-height: 0; overflow: hidden; }
      #chat .ln.on { opacity: 1; max-height: 130px; margin: 3px 0; }
      #chat .sys { color: #ffd34a; }
      #board { position: absolute; right: 36px; top: 46px; width: 330px; }
      #board .hd { color: #fff; font-weight: 900; font-size: 28px; text-align: right; opacity: .8; margin-bottom: 8px; text-shadow: 0 2px 4px #000; }
      #board .row { display: flex; align-items: center; gap: 12px; height: 56px; margin-bottom: 6px; padding: 0 14px; border-radius: 10px; background: rgba(15,17,22,.55); color: #fff; font-weight: 800; font-size: 28px; opacity: 0; }
      #board .row.on { opacity: 1; }
      #board .row u { width: 34px; height: 34px; border-radius: 6px; background: #f5cd30; display: inline-block; }
      #board .row.zero u { background: #e9e9e9; }
      #board .row.red { color: #ff5a5a; }
      #stick { position: absolute; left: 70px; bottom: 150px; width: 250px; height: 250px; border-radius: 50%; border: 6px solid rgba(255,255,255,.28); background: rgba(255,255,255,.06); }
      #stick:after { content: ""; position: absolute; left: 85px; top: 85px; width: 80px; height: 80px; border-radius: 50%; background: rgba(255,255,255,.3); }
      #jump { position: absolute; right: 90px; bottom: 170px; width: 170px; height: 170px; border-radius: 50%; border: 6px solid rgba(255,255,255,.28); background: rgba(255,255,255,.1); }
      #jump:after { content: ""; position: absolute; left: 52px; top: 48px; border: 34px solid transparent; border-bottom: 46px solid rgba(255,255,255,.55); border-top: 0; }
      #menu { position: absolute; left: 150px; right: 150px; top: 560px; padding: 34px; border-radius: 22px; background: rgba(18,20,26,.92); border: 4px solid rgba(255,255,255,.2); opacity: 0; }
      #menu .t { color: #fff; font-weight: 900; font-size: 46px; text-align: center; margin-bottom: 22px; }
      #menu .b { height: 98px; margin-bottom: 18px; border-radius: 14px; background: #3a3f4a; color: #fff; font-weight: 900; font-size: 42px; display: flex; align-items: center; justify-content: center; }
      #menu .b.leave { background: #c0262d; }
      #menu .b.leave.gone { visibility: hidden; }

      /* ---------- plates + captions ---------- */
      .plate { position: absolute; left: 0; right: 0; top: 330px; display: flex; flex-direction: column; align-items: center; gap: 14px; opacity: 0; text-align: center; }
      .plate .tag { font-weight: 900; font-size: 54px; letter-spacing: 4px; color: #fff; background: #d4121f; padding: 8px 30px 6px; border-radius: 6px; }
      .plate .big { font-weight: 900; font-size: 100px; line-height: 1.02; color: #fff; max-width: 940px; text-transform: uppercase; -webkit-text-stroke: 12px #000; paint-order: stroke fill; text-shadow: 0 6px 24px rgba(0,0,0,.8); }
      .y { color: #ffd60a; } .r { color: #ff3b30; }
      #cap { position: absolute; left: 60px; right: 60px; bottom: 470px; height: 420px; }
      .chunk { position: absolute; left: 0; right: 0; bottom: 0; display: flex; justify-content: center; opacity: 0; }
      .chunk span.t { display: block; text-align: center; font-weight: 900; font-size: 104px; line-height: 1.04; text-transform: uppercase; color: #fff; -webkit-text-stroke: 15px #000; paint-order: stroke fill; text-shadow: 0 6px 20px rgba(0,0,0,.7); max-width: 960px; }
      .chunk.big span.t { font-size: 124px; }
      #part2 { position: absolute; left: 0; right: 0; top: 880px; text-align: center; font-weight: 900; font-size: 92px; color: #fff; letter-spacing: 6px; opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-width="1080" data-height="1920" data-duration="98.6">
      <canvas id="gl" width="1080" height="1920"></canvas>
      <div id="vignette" class="layer"></div>
      <div id="redtint" class="layer"></div>
      <div id="grain" class="layer"></div>

      <div id="hud-menu" class="hud-btn"><i></i><i></i><i></i></div>
      <div id="hud-chat" class="hud-btn"><b></b></div>
      <div id="chat"></div>
      <div id="board"><div class="hd">Players</div></div>
      <div id="stick"></div><div id="jump"></div>
      <div id="menu"><div class="t">Menu</div><div class="b">Resume</div><div class="b">Reset Character</div><div class="b leave" id="leavebtn">Leave</div></div>

      <div id="plate-r1" class="plate"><div class="tag">RULE 1</div><div class="big"><span class="r">NEVER LOOK</span> AWAY</div></div>
      <div id="plate-r2" class="plate"><div class="tag">RULE 2</div><div class="big"><span class="y">NEVER ANSWER</span> IN CHAT</div></div>
      <div id="plate-r3" class="plate"><div class="tag">RULE 3</div><div class="big"><span class="r">NEVER LEAVE</span> THE SERVER</div></div>

      <div id="cap"></div>
      <div id="glitch" class="layer"></div>
      <div id="flash" class="layer"></div>
      <div id="dip" class="layer"></div>
      <div id="part2">PART 2 SOON</div>

      <audio id="vo" src="assets/vo_master.wav" data-start="0" data-duration="95.8" data-track-index="2" data-volume="1"></audio>
      <audio id="bed" src="assets/bed.wav" data-start="0" data-duration="98.6" data-track-index="3" data-volume="0.4"></audio>
    </div>

    <script>
      const C = window.CUE;
      // ---------- captions + plates (seekable GSAP timeline)
      const tl = gsap.timeline({ paused: true });
      const cap = document.getElementById("cap");
      window.CAPS.forEach((c, i) => {
        const el = document.createElement("div");
        el.className = "chunk" + (/RULE (ONE|TWO|THREE)|NEVER/.test(c.t) ? " big" : "");
        const s = document.createElement("span"); s.className = "t";
        s.innerHTML = c.t.replace(/(NEVER LOOK AWAY|NEVER ANSWER IN CHAT|NEVER LEAVE THE SERVER|PLAYER ZERO|RED)/g, '<span class="r">$1</span>');
        el.appendChild(s); cap.appendChild(el);
        tl.set(el, { opacity: 1 }, c.s);
        tl.fromTo(s, { scale: 0.86 }, { scale: 1, duration: 0.14, ease: "back.out(2.4)" }, c.s);
        tl.set(el, { opacity: 0 }, c.e);
      });
      const plate = (id, a, b) => {
        tl.set(id, { opacity: 1 }, a);
        tl.fromTo(id, { scale: 1.25 }, { scale: 1, duration: 0.18, ease: "power4.out" }, a);
        tl.to(id, { x: 6, duration: 0.05, yoyo: true, repeat: 3, ease: "none" }, a + 0.2);
        tl.set(id, { opacity: 0 }, b);
      };
      plate("#plate-r1", C.rule1, C.t.blinked - 0.2);
      plate("#plate-r2", C.rule2, C.t.typed - 0.1);
      plate("#plate-r3", C.rule3, C.t.pressed - 0.1);
      tl.set("#part2", { opacity: 1 }, C.endBlack + 0.3);
      window.__timelines["main"] = tl;

      // ---------- Roblox HUD: chat, player list, leave menu (pure function of time)
      const chat = document.getElementById("chat"), board = document.getElementById("board");
      const lines = C.chat.map((m) => {
        const d = document.createElement("div"); d.className = "ln" + (m.sys ? " sys" : "");
        d.innerHTML = m.sys ? m.text : `<span style="color:${m.color}">[${m.name}]:</span> ${m.text}`;
        chat.appendChild(d); return { t: m.t, d };
      });
      const rows = {};
      ["YOU_2012", "Player_0", "NEWCOMER"].forEach((n) => {
        const r = document.createElement("div"); r.className = "row"; r.innerHTML = "<u></u><span></span>"; board.appendChild(r); rows[n] = r;
      });
      const menu = document.getElementById("menu"), leave = document.getElementById("leavebtn");
      window.__ui = (t) => {
        lines.forEach((l) => l.d.classList.toggle("on", t >= l.t));
        const swapped = t >= C.nameSwap, zeroIn = t >= C.zeroAppear && t < C.zeroGone;
        const set = (k, on, name, red, zero) => { const r = rows[k]; r.classList.toggle("on", on); r.classList.toggle("red", !!red); r.classList.toggle("zero", !!zero); r.lastChild.textContent = name; };
        set("YOU_2012", t < C.heroGone, swapped ? "Player_0" : "YOU_2012", swapped, swapped);
        set("Player_0", zeroIn, "Player_0", true, true);
        set("NEWCOMER", t >= C.newPlayer, "Player_0", true, true);
        menu.style.opacity = t >= C.menuOn && t < C.menuOff ? 1 : 0;
        leave.classList.toggle("gone", t >= C.leaveGone && Math.floor(t * 8) % 2 === 0 || t >= C.leaveGone + 0.9);
      };
    </script>
    <script type="module" src="scene.js"></script>
  </body>
</html>
