<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Зомби-апокалипсис: ты дома</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <script src="assets/captions.js"></script>
    <script src="assets/cues.js"></script>
    <script type="importmap">
      { "imports": { "three": "./assets/vendor/three.module.js" } }
    </script>
    <style>
      @font-face { font-family: "Mont"; font-weight: 800; src: url("assets/fonts/montserrat-cyrillic-800-normal.woff2") format("woff2"); unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
      @font-face { font-family: "Mont"; font-weight: 800; src: url("assets/fonts/montserrat-latin-800-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
      @font-face { font-family: "Mont"; font-weight: 900; src: url("assets/fonts/montserrat-cyrillic-900-normal.woff2") format("woff2"); unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
      @font-face { font-family: "Mont"; font-weight: 900; src: url("assets/fonts/montserrat-latin-900-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
      html, body { margin: 0; background: #000; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: "Mont", sans-serif; }
      #gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      .layer { position: absolute; inset: 0; pointer-events: none; }
      #vignette { background: radial-gradient(ellipse at 50% 46%, rgba(0,0,0,0) 40%, rgba(0,0,0,.6) 100%), linear-gradient(to bottom, rgba(0,0,0,.35) 0%, rgba(0,0,0,0) 20%, rgba(0,0,0,0) 62%, rgba(0,0,0,.45) 100%); }
      #grain { opacity: .1; mix-blend-mode: overlay; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='300' height='300' filter='url(%23n)'/></svg>"); background-size: 300px 300px; }
      #flash { background: #fff; opacity: 0; }
      #redtint { background: #b00014; opacity: 0; mix-blend-mode: multiply; }
      #glitch { background: linear-gradient(90deg, rgba(255,0,60,.22), rgba(0,255,255,.22)); opacity: 0; mix-blend-mode: screen; }
      #dip { background: #000; opacity: 1; }
      #peep { opacity: 0; background: radial-gradient(circle at 50% 46%, rgba(0,0,0,0) 0, rgba(0,0,0,0) 37%, rgba(30,24,14,.95) 38.5%, #000 41%); }
      #peepRing { position: absolute; left: 50%; top: 46%; width: 790px; height: 790px; margin: -395px 0 0 -395px; border-radius: 50%; box-shadow: inset 0 0 90px 30px rgba(0,0,0,.9), 0 0 0 8px rgba(190,160,80,.7); opacity: 0; }

      /* TikTok-survival HUD */
      #timer { position: absolute; right: 44px; top: 70px; text-align: right; opacity: 0; }
      #timer .lb { font-weight: 800; font-size: 30px; letter-spacing: 3px; color: #fff; text-shadow: 0 2px 6px #000; }
      #timer .tm { font-weight: 900; font-size: 92px; line-height: 1; color: #ffd60a; -webkit-text-stroke: 8px #000; paint-order: stroke fill; }
      #timer.red .tm { color: #ff3b30; }
      #check { position: absolute; left: 44px; top: 70px; width: 520px; }
      #check .row { display: flex; align-items: center; gap: 16px; margin-bottom: 12px; padding: 8px 16px; border-radius: 12px; background: rgba(10,10,12,.6); color: #fff; font-weight: 800; font-size: 34px; opacity: 0; }
      #check .row.on { opacity: 1; }
      #check .row b { width: 36px; height: 36px; border-radius: 8px; border: 4px solid #fff; display: inline-block; position: relative; box-sizing: border-box; }
      #check .row.done b { background: #3ddc5a; border-color: #3ddc5a; }
      #check .row.done b:after { content: ""; position: absolute; left: 9px; top: 2px; width: 8px; height: 17px; border: solid #04210c; border-width: 0 5px 5px 0; transform: rotate(40deg); }
      #check .row.done span { text-decoration: line-through; opacity: .65; }
      #phoneUI { position: absolute; left: 280px; top: 520px; width: 520px; padding: 36px 30px 40px; border-radius: 46px; background: #0b0f14; border: 6px solid #2a323c; box-shadow: 0 20px 60px rgba(0,0,0,.7); opacity: 0; color: #fff; text-align: center; }
      #phoneUI .ic { width: 110px; height: 110px; margin: 0 auto 18px; border-radius: 50%; background: #1d2630; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 54px; }
      #phoneUI .t1 { font-weight: 900; font-size: 56px; }
      #phoneUI .t2 { font-weight: 800; font-size: 32px; opacity: .8; margin-top: 10px; }
      #phoneUI .t3 { font-weight: 800; font-size: 30px; color: #ff6a5a; margin-top: 22px; }

      .plate { position: absolute; left: 0; right: 0; top: 400px; display: flex; flex-direction: column; align-items: center; gap: 14px; opacity: 0; text-align: center; }
      .plate .tag { font-weight: 900; font-size: 54px; letter-spacing: 4px; color: #fff; background: #d4121f; padding: 8px 30px 6px; border-radius: 6px; }
      .plate .big { font-weight: 900; font-size: 98px; line-height: 1.02; color: #fff; max-width: 960px; text-transform: uppercase; -webkit-text-stroke: 12px #000; paint-order: stroke fill; text-shadow: 0 6px 24px rgba(0,0,0,.8); }
      .plate .big.sm { font-size: 80px; }
      .y { color: #ffd60a; } .r { color: #ff3b30; }
      #cap { position: absolute; left: 60px; right: 60px; bottom: 440px; height: 420px; }
      .chunk { position: absolute; left: 0; right: 0; bottom: 0; display: flex; justify-content: center; opacity: 0; }
      .chunk span.t { display: block; text-align: center; font-weight: 900; font-size: 102px; line-height: 1.04; text-transform: uppercase; color: #fff; -webkit-text-stroke: 15px #000; paint-order: stroke fill; text-shadow: 0 6px 20px rgba(0,0,0,.7); max-width: 960px; }
      .chunk.big span.t { font-size: 120px; }
      #part2 { position: absolute; left: 0; right: 0; top: 880px; text-align: center; font-weight: 900; font-size: 92px; color: #fff; letter-spacing: 6px; opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-width="1080" data-height="1920" data-duration="80">
      <canvas id="gl" width="1080" height="1920"></canvas>
      <div id="peep" class="layer"></div><div id="peepRing"></div>
      <div id="vignette" class="layer"></div>
      <div id="redtint" class="layer"></div>
      <div id="grain" class="layer"></div>

      <div id="check"></div>
      <div id="timer"><div class="lb">ОСТАЛОСЬ</div><div class="tm" id="tm">10:00</div></div>
      <div id="phoneUI"><div class="ic" id="pic">!</div><div class="t1" id="p1"></div><div class="t2" id="p2"></div><div class="t3" id="p3"></div></div>

      <div id="plate-hook" class="plate" style="top:300px"><div class="big sm">ЗОМБИ-АПОКАЛИПСИС. <span class="y">ТЫ ДОМА.</span></div></div>
      <div id="plate-r1" class="plate"><div class="tag">ПРАВИЛО №1</div><div class="big"><span class="y">ВЫКЛЮЧИ</span> СВЕТ</div></div>
      <div id="plate-r2" class="plate"><div class="tag">ПРАВИЛО №2</div><div class="big"><span class="y">НАБЕРИ</span> ВОДУ</div></div>
      <div id="plate-r3" class="plate"><div class="tag">ПРАВИЛО №3</div><div class="big"><span class="y">ЗАБЛОКИРУЙ</span> ДВЕРЬ</div></div>
      <div id="plate-r4" class="plate"><div class="tag">ПРАВИЛО №4</div><div class="big"><span class="y">СОБЕРИ</span> РЮКЗАК</div></div>
      <div id="plate-r5" class="plate"><div class="tag">ПРАВИЛО №5</div><div class="big sm"><span class="r">НЕ ВЕРЬ ГОЛОСУ</span> ЗА ДВЕРЬЮ</div></div>

      <div id="cap"></div>
      <div id="glitch" class="layer"></div>
      <div id="flash" class="layer"></div>
      <div id="dip" class="layer"></div>
      <div id="part2">ЧАСТЬ 2 — ЕСЛИ ВЫЖИВЕШЬ</div>

      <audio id="vo" src="assets/vo_master.wav" data-start="0" data-duration="76.6" data-track-index="2" data-volume="1"></audio>
      <audio id="bed" src="assets/bed.wav" data-start="0" data-duration="80" data-track-index="3" data-volume="0.4"></audio>
    </div>

    <script>
      const C = window.CUE, T = C.t;
      const tl = gsap.timeline({ paused: true });
      const cap = document.getElementById("cap");
      window.CAPS.forEach((c) => {
        if (c.e < 3.7) return; // hook plate already says it
        const el = document.createElement("div");
        el.className = "chunk" + (/ПРАВИЛО|ГЛАЗОК|ЗОМБИ/.test(c.t) ? " big" : "");
        const s = document.createElement("span"); s.className = "t";
        s.innerHTML = c.t.replace(/(НЕ ВЕРЬ|НЕ СМОТРИ|ЗОМБИ|ТЫ ДОМА|ДЕСЯТЬ МИНУТ|НЕ ОТКРЫЛ)/g, '<span class="r">$1</span>');
        el.appendChild(s); cap.appendChild(el);
        tl.set(el, { opacity: 1 }, c.s);
        tl.fromTo(s, { scale: 0.86 }, { scale: 1, duration: 0.14, ease: "back.out(2.4)" }, c.s);
        tl.set(el, { opacity: 0 }, c.e);
      });
      const plate = (id, a, b) => {
        tl.set(id, { opacity: 1 }, a);
        tl.fromTo(id, { scale: 1.25 }, { scale: 1, duration: 0.18, ease: "power4.out" }, a);
        tl.to(id, { x: 6, duration: 0.05, yoyo: true, repeat: 3, ease: "none" }, a + 0.2);
        tl.set(id, { opacity: 0 }, b);
      };
      plate("#plate-hook", 0.05, T.five - 0.3);
      plate("#plate-r1", T.rule1, T.rule2 - 0.3); plate("#plate-r2", T.rule2, T.rule3 - 0.3); plate("#plate-r3", T.rule3, T.rule4 - 0.3);
      plate("#plate-r4", T.rule4, T.heard - 0.3); plate("#plate-r5", T.rule5, T.stepBack - 0.2);
      tl.set("#part2", { opacity: 1 }, C.endBlack + 0.25);
      window.__timelines["main"] = tl;

      // checklist + countdown + phone UI + peephole ring: pure functions of time
      const rules = [["Выключить свет", T.rule1, T.rule2 - 0.4], ["Набрать воду", T.rule2, T.rule3 - 0.4], ["Заблокировать дверь", T.rule3, T.rule4 - 0.4], ["Собрать рюкзак", T.rule4, T.heard - 0.4]];
      const check = document.getElementById("check");
      const rows = rules.map(([txt]) => { const r = document.createElement("div"); r.className = "row"; r.innerHTML = "<b></b><span>" + txt + "</span>"; check.appendChild(r); return r; });
      const timer = document.getElementById("timer"), tm = document.getElementById("tm");
      const ui = document.getElementById("phoneUI"), p1 = document.getElementById("p1"), p2 = document.getElementById("p2"), p3 = document.getElementById("p3"), pic = document.getElementById("pic");
      const ring = document.getElementById("peepRing");
      window.__ui = (t) => {
        rules.forEach(([, a, d], i) => { rows[i].classList.toggle("on", t >= a); rows[i].classList.toggle("done", t >= d); });
        const show = t >= T.minutes + 0.9 && t < T.knock + 1.6;
        timer.style.opacity = show ? 1 : 0;
        const left = t < T.heard ? Math.max(0, 600 * (1 - (t - (T.minutes + 0.9)) / (T.heard - (T.minutes + 0.9)))) : 0;
        const m = Math.floor(left / 60), s = Math.floor(left % 60); tm.textContent = String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
        timer.classList.toggle("red", left < 150);
        const silent = t >= T.phone + 1.2 && t < T.rule2 - 0.3, call = t >= T.momCalled - 0.1 && t < T.notOpen - 0.3;
        ui.style.opacity = silent || call ? 1 : 0;
        if (silent) { pic.textContent = "✕"; p1.textContent = "Без звука"; p2.textContent = "Режим тишины включён"; p3.textContent = ""; }
        if (call) { pic.textContent = "М"; p1.textContent = "Мама"; p2.textContent = "Входящий · 5 минут назад"; p3.textContent = "Другой город"; }
        ring.style.opacity = t >= T.peephole && t < T.rule4 ? 1 : 0;
      };
    </script>
    <script type="module" src="scene.js"></script>
  </body>
</html>
